name: Release

on:
  push:
    tags:
      - 'v*'
  # Callable so another workflow can cut a release in the same run. A tag pushed
  # with GITHUB_TOKEN does NOT trigger the push event above — GitHub suppresses
  # that to avoid recursive runs — so security-release.yml calls this directly
  # rather than relying on its tag push to start it.
  workflow_call:
    inputs:
      ref:
        description: Tag to build the release from.
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # On a tag push this is empty and checkout uses the triggering ref.
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum
      
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
