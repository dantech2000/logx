name: Security release

# Cuts a patch release when a Dependabot *security* update merges.
#
# Go compiles its dependencies in, so a bumped go.mod protects nobody still
# running an installed binary — the fix only reaches users once a release is
# built. Releases here are tag-triggered and tags are made by hand, so without
# this a CVE fix could sit in main indefinitely (which is exactly what happened
# with GO-2026-5970 in golang.org/x/text).
#
# Routine version bumps deliberately do NOT release: most are transitive k8s
# updates, and tagging each one would churn the Homebrew cask for no user-visible
# change. Those ride along with the next manual release.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  tag:
    # Only a merged Dependabot PR can qualify; a closed-unmerged PR must not.
    if: github.event.pull_request.merged == true && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        if: steps.meta.outputs.ghsa-id != ''
        uses: actions/checkout@v7
        with:
          # Full history so the tag list is visible for the version bump.
          fetch-depth: 0
          ref: main

      - name: Compute and push the next patch tag
        id: version
        if: steps.meta.outputs.ghsa-id != ''
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            echo "no existing v*.*.* tag; refusing to guess a starting version" >&2
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r major minor patch <<< "${latest#v}"
          next="v${major}.${minor}.$((patch + 1))"

          if git rev-parse "$next" >/dev/null 2>&1; then
            echo "tag $next already exists; skipping" >&2
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Releasing $next for ${GHSA} (${DEPS})"
          git tag -a "$next" -m "Release ${next}

          Security update for ${GHSA} in ${DEPS}."
          git push origin "$next"

          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"
        env:
          GHSA: ${{ steps.meta.outputs.ghsa-id }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}

  release:
    needs: tag
    if: needs.tag.outputs.released == 'true'
    # Reused rather than left to the tag push: a tag created with GITHUB_TOKEN
    # does not trigger the Release workflow's push event.
    uses: ./.github/workflows/releaser.yaml
    with:
      ref: ${{ needs.tag.outputs.tag }}
    secrets: inherit
