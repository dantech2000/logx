apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
  namespace: default
spec:
  initContainers:
    - name: migrate
      image: ghcr.io/example/migrate:v1
  containers:
    - name: app
      image: ghcr.io/example/app:v2
    - name: sidecar
      image: ghcr.io/example/sidecar:v1
    - name: worker
      image: ghcr.io/example/worker:v3
status:
  containerStatuses:
    - name: app
      ready: true
      restartCount: 0
      state:
        running:
          startedAt: "2026-05-15T00:38:00Z"
    - name: sidecar
      ready: false
      restartCount: 2
      state:
        waiting:
          reason: CrashLoopBackOff
    - name: worker
      ready: false
      restartCount: 1
      state:
        terminated:
          reason: Error
          exitCode: 1
          finishedAt: "2026-05-15T00:39:00Z"
