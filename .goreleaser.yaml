version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: logx
    binary: logx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X github.com/dantech2000/logx/pkg/version.commitHash={{.Commit}}
      - -X github.com/dantech2000/logx/pkg/version.buildDate={{.Date}}
    main: ./main.go
  - id: kubectl-logx
    binary: kubectl-logx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X github.com/dantech2000/logx/pkg/version.commitHash={{.Commit}}
      - -X github.com/dantech2000/logx/pkg/version.buildDate={{.Date}}
    main: ./main.go

archives:
  - id: logx-archive
    ids:
      - logx
      - kubectl-logx
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

homebrew_casks:
  - name: logx
    ids:
      - logx-archive
    binaries:
      - logx
      - kubectl-logx
    repository:
      owner: dantech2000
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    homepage: 'https://github.com/dantech2000/logx'
    description: 'Enhanced Kubernetes pod log viewer'
    license: 'MIT'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch
