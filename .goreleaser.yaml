version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: logx
    binary: logx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dantech2000/logx/internal/version.version={{.Version}}
      - -X github.com/dantech2000/logx/internal/version.commitHash={{.Commit}}
      - -X github.com/dantech2000/logx/internal/version.buildDate={{.Date}}
    main: ./main.go
  - id: kubectl-logx
    binary: kubectl-logx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dantech2000/logx/internal/version.version={{.Version}}
      - -X github.com/dantech2000/logx/internal/version.commitHash={{.Commit}}
      - -X github.com/dantech2000/logx/internal/version.buildDate={{.Date}}
    main: ./main.go

archives:
  - id: logx-archive
    ids:
      - logx
      - kubectl-logx
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

release:
  github:
    owner: dantech2000
    name: logx
  mode: replace

homebrew_casks:
  - name: logx
    ids:
      - logx-archive
    binaries:
      - logx
      - kubectl-logx
    repository:
      owner: dantech2000
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    homepage: 'https://github.com/dantech2000/logx'
    description: 'Enhanced Kubernetes pod log viewer'
    license: 'MIT'
    # The release binaries are not Developer ID-signed, so clear the download
    # quarantine after Homebrew stages them. Homebrew 6.0.22 deprecated the Ruby
    # `postflight` block that `hooks.post.install` emits, so declare the
    # replacement `postflight_steps` stanza through `custom_block` instead.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/logx"]
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/kubectl-logx"]
        end
      end

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch
